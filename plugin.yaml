schema: mcpg.dev/plugin/v1
id: dev.mcpg.webhook
name: Webhook Notifications
license: Apache-2.0
description: |
  Emits webhooks for tool calls (completed / error / slow_response)
  with Standard Webhooks headers, signed when an endpoint sets
  signing_secrets. Fire-and-forget with bounded retries; does not
  participate in the request decision.
class: tool_gate
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities:
  # Fire-and-forget outbound HTTP POST to configured endpoints.
  - network_outbound
